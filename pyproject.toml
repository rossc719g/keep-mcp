[project]
name = "keep-mcp"
version = "0.4.0"
description = "Personal local Google Keep MCP with Keychain credentials and guarded writes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gkeepapi==0.17.1",
    "mcp==2.2.0",
    "requests==2.34.2",
    "keyring==25.7.0",
]
authors = [
    { name = "Jannik Feuerhahn", email = "jannik@feuer.dev" }
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rossc719g/keep-mcp"
Repository = "https://github.com/rossc719g/keep-mcp"

[project.scripts]
keep-mcp = "server.cli:main"
keep-mcp-setup = "server.setup:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.10", "pip-audit==2.10.1", "uv==0.11.15", "hatchling==1.32.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
