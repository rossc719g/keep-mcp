name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install uv==0.11.15
          uv sync --frozen --python python

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Run tests with coverage
        run: uv run --frozen pytest -q --cov=src/server --cov-report=term-missing --cov-fail-under=70

      - name: Bytecode sanity
        run: uv run --frozen python -m compileall src
